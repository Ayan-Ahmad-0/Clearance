databases:
  - name: clearance-db
    databaseName: clearance
    user: clearance
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: clearance
    runtime: python
    plan: free
    buildCommand: pip install -e . && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"
    startCommand: python scripts/init_db.py && uvicorn clearance.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clearance-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ORG_DIR
        value: data/org_nist
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CLEARANCE_LLM
        value: fake
      - key: GEMINI_API_KEY
        sync: false
